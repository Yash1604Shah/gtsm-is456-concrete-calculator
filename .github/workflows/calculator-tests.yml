name: GTSM calculator numerical tests
on:
  push:
    paths:
      - 'toolbox/**'
      - '.github/workflows/calculator-tests.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check toolbox/toolbox.js
      - run: node toolbox/toolbox.test.cjs
